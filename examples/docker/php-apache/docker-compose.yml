services:
  web:
    image: authgo-docker-php-apache-example:local
    build:
      context: ../../..
      dockerfile: examples/docker/php-apache/Dockerfile
      args:
        AUTHGO_CONFIG: ${AUTHGO_CONFIG:-}
        VERSION: ${VERSION:-1.0.0}
    environment:
      AUTHGO_LICENSE: ${AUTHGO_LICENSE:-}
    ports: [127.0.0.1:8090:8080]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    stop_grace_period: 10s
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    volumes: [authgo_cache:/var/lib/authgo]
volumes:
  authgo_cache:
