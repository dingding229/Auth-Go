services:
  authgo:
    image: docker.io/dingding229/authgo:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - authgo_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  authgo_data:
